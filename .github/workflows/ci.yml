name: CI Verification & Validation

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  metadata-lint:
    name: Lint, Metadata & Documentation Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy matplotlib pillow pyyaml reuse

      - name: Check REUSE Compliance
        run: |
          reuse lint

      - name: Validate CITATION.cff
        run: |
          python3 -c "import yaml; yaml.safe_load(open('CITATION.cff'))"

      - name: Verify Documentation Links
        run: |
          python3 -c "
          import re, os, glob
          files = sorted([f for f in glob.glob('**/*.md', recursive=True) if not f.startswith('.git/')])
          broken = []
          for f in files:
              content = open(f).read()
              if 'file:///' in content:
                  broken.append((f, 'contains file:/// absolute link'))
              dirname = os.path.dirname(f)
              links = re.findall(r'\[.*?\]\(([^)#:\s]+(?:#[^)]*)?)\)', content)
              img_links = re.findall(r'!\[.*?\]\(([^)#:\s]+)\)', content)
              for l in links + img_links:
                  p = l.split('#')[0]
                  if not p or p.startswith('http'):
                      continue
                  fp = os.path.normpath(os.path.join(dirname, p))
                  if not os.path.exists(fp):
                      broken.append((f, f'broken link: {l} -> {fp}'))
          if broken:
              for b in broken:
                  print(b)
              exit(1)
          print('All links and media paths valid!')
          "

  openfoam-tests:
    name: Run Verification & Validation in OpenFOAM v2412 Container
    runs-on: ubuntu-latest
    container:
      image: opencfd/openfoam-default:2412
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          rm -f /etc/apt/sources.list.d/*openfoam* 2>/dev/null || true
          grep -l "openfoam.com" /etc/apt/sources.list.d/* 2>/dev/null | xargs -r rm -f || true
          sed -i '/openfoam\.com/d' /etc/apt/sources.list 2>/dev/null || true
          apt-get update || true
          apt-get install -y --no-install-recommends python3-numpy python3-matplotlib python3-pil
        shell: bash

      - name: Build phaseChangeFoam solvers
        run: |
          set +e
          source /usr/lib/openfoam/openfoam2412/etc/bashrc
          set -e
          ./Allwmake
          mkdir -p /usr/local/bin
          cp -f ${FOAM_USER_APPBIN}/* /usr/local/bin/ 2>/dev/null || true
        shell: bash

      - name: Run Master Verification Suite (13 suites)
        run: |
          set +e
          source /usr/lib/openfoam/openfoam2412/etc/bashrc
          set -e
          python3 verification/runAll.py
          ./verification/Allclean
        shell: bash

      - name: Run Validation Benchmark Ladder (5 rungs)
        run: |
          set +e
          source /usr/lib/openfoam/openfoam2412/etc/bashrc
          set -e
          python3 validation/runAll.py
          ./validation/Allclean
        shell: bash
